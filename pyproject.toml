[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-key4hep"
version = "0.1.0"
description = "Committed, pinned Key4hep generation workflows exposed over MCP"
requires-python = ">=3.11"
dependencies = ["mcp>=1.28,<2"]

[project.scripts]
mcp-server-key4hep = "mcp_server_key4hep.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
